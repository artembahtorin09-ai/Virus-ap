name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Find and setup AIDL
      run: |
        # Ищем, куда установился aidl, и прописываем его в PATH
        AIDL_PATH=$(which aidl)
        echo "AIDL found at: $AIDL_PATH"
        echo "AIDL=$AIDL_PATH" >> $GITHUB_ENV
        # Создаем симлинк в папку, где Buildozer его точно найдет
        sudo ln -sf $AIDL_PATH /usr/local/bin/aidl

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
