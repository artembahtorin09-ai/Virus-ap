name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Fix SDK Manager
      run: |
        # Скачиваем свежие command-line tools от Google
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        cd ~/.buildozer/android/platform/android-sdk/cmdline-tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools latest
        # Создаем структуру, которую ждет Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        cp latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/
        chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        echo "SDK Manager installed!"

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
