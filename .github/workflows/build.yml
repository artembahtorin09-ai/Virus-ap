name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
        pip install --upgrade buildozer cython

    - name: Fix AIDL for Buildozer
      run: |
        # Скачиваем build-tools вручную, чтобы там появился aidl
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
        cd ~/.buildozer/android/platform/android-sdk/build-tools
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q build-tools_r34-linux.zip
        # Переименовываем папку, как этого ждет Buildozer
        mv android-14 build-tools
        # Создаем символическую ссылку на aidl
        sudo ln -sf ~/.buildozer/android/platform/android-sdk/build-tools/build-tools/aidl /usr/local/bin/aidl
        echo "AIDL установлен в build-tools!"

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
