name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential
        pip install --upgrade buildozer cython

    - name: Patch Buildozer (Skip SDK & AIDL Checks)
      run: |
        # Находим файл android.py
        TARGET_FILE=$(find /opt/hostedtoolcache/Python -name "android.py" -path "*buildozer*" | head -n 1)
        echo "Patching $TARGET_FILE"
        
        # Отключаем проверку SDK Manager
        sed -i 's/if not sdkmanager_path/if False:/g' $TARGET_FILE
        sed -i 's/raise BuildozerException/# raise BuildozerException/g' $TARGET_FILE
        
        # Отключаем проверку AIDL (правим только саму строку с ошибкой)
        sed -i 's/if not self.check_aidl():/if False:/g' $TARGET_FILE
        
        # Отключаем проверку zlib
        sed -i 's/if not self.check_zlib():/if False:/g' $TARGET_FILE
        
        echo "Buildozer patched! Let's go!"

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
