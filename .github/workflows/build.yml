name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Patch Buildozer (Skip checks)
      run: |
        # Находим файл target/android.py
        TARGET_FILE=$(find /opt/hostedtoolcache/Python -name "android.py" -path "*buildozer*" | head -n 1)
        echo "Target file: $TARGET_FILE"
        
        # Отключаем проверку zlib
        sed -i 's/if not self.check_zlib():/if False:/g' $TARGET_FILE
        
        # Отключаем проверку aidl (если она есть)
        sed -i 's/# Aidl not found, please install it\./print("AIDL skipped!")/g' $TARGET_FILE
        
        # Отключаем проверку sdkmanager
        sed -i 's/if not sdkmanager path/if False:/g' $TARGET_FILE
        
        echo "Buildozer patched!"

    - name: Build APK
      run: |
        # Запускаем сборку
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
