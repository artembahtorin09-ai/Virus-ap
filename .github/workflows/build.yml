name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Setup Fake SDK with Fake List
      run: |
        # 1. Создаем папки
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools

        # 2. Создаем фейковый sdkmanager, который выдает правильный список версий
        cat << 'EOF' > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        #!/bin/bash
        if [[ "$*" == *"--list"* ]]; then
            echo "Available Packages:"
            echo "  build-tools;34.0.0"
            echo "  platforms;android-33"
        else
            echo "Installed successfully"
        fi
        exit 0
        EOF
        chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

        # 3. Скачиваем настоящий build-tools 34.0.0
        cd ~/.buildozer/android/platform/android-sdk/build-tools
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q build-tools_r34-linux.zip
        mv android-14 34.0.0

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
