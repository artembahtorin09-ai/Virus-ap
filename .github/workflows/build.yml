name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Setup Android SDK (Real Build Tools)
      run: |
        # Создаем папки
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
        
        # Качаем официальный sdkmanager
        cd ~/.buildozer/android/platform/android-sdk/tools/bin
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q commandlinetools-linux-11076708_latest.zip
        mv cmdline-tools sdkmanager_dir
        cp sdkmanager_dir/bin/sdkmanager .
        chmod +x sdkmanager
        
        # Качаем официальный build-tools (версия 34.0.0)
        cd ~/.buildozer/android/platform/android-sdk/build-tools
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q build-tools_r34-linux.zip
        mv android-14 build-tools

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
