name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential aidl
        pip install --upgrade buildozer cython

    - name: Create Fake SDK Manager
      run: |
        # 1. Создаем папку, которую ждет Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        # 2. Создаем фейковый файл sdkmanager, который просто возвращает "OK"
        echo -e '#!/bin/bash\necho "SDK Manager: OK"\nexit 0' > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 3. Скачиваем настоящий aidl и кладем туда, где его ищет Buildozer
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools
        wget -q https://dl.google.com/android/repository/build-tools_r34-linux.zip
        unzip -q build-tools_r34-linux.zip -d ~/.buildozer/android/platform/android-sdk/build-tools
        mv ~/.buildozer/android/platform/android-sdk/build-tools/android-14 ~/.buildozer/android/platform/android-sdk/build-tools/build-tools

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyVirusApp
        path: bin/*.apk
